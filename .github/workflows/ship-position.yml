name: Ship position

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: ship-position
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install websockets==13.1

      - name: Check where the ship is
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          SHIP_MMSI: "316001637"
        run: python fetch_position.py

      - name: Save it
        run: |
          git config user.name "ship-position-bot"
          git config user.email "ship-position-bot@users.noreply.github.com"
          git add position.json
          git commit -m "Position update" || echo "No change"
          git push
